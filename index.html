<title>ITF TUL Scoreboard</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&display=swap">
<style>
  /* One screen, no scrolling. Landscape: red | centre strip | blue (mirrored). Portrait: red / strip / blue. */
  :root {
    --bg: #E8EBF0; --fg: #141A24; --line: #C6CCD7;
    --red: #C42E33; --blue: #1D4DBB;
    --font-display: 'Barlow Condensed', 'Arial Narrow', 'Helvetica Neue', sans-serif;
    --font-body: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { --bg: #0D1117; --fg: #E7EBF2; --line: #262D3A; --red: #B02429; --blue: #1A429E; color-scheme: dark; }
  }
  :root[data-theme="dark"] { --bg: #0D1117; --fg: #E7EBF2; --line: #262D3A; --red: #B02429; --blue: #1A429E; color-scheme: dark; }

  [hidden] { display: none !important; }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; background: var(--bg); color: var(--fg); font-family: var(--font-body);
    padding-block: 8px; padding-left: max(12px, env(safe-area-inset-left, 0px)); padding-right: max(12px, env(safe-area-inset-right, 0px));
    display: flex; flex-direction: column; -webkit-tap-highlight-color: transparent; touch-action: manipulation;
  }
  button { font: inherit; color: inherit; cursor: pointer; border: 0; user-select: none; -webkit-user-select: none; }
  button:focus-visible { outline: 3px solid #fff; outline-offset: 2px; }
  .btn:focus-visible { outline-color: var(--fg); }
  @media (max-height: 400px) { body { padding-block: 5px; } }

  main {
    flex: 1; min-height: 0; overflow: hidden; display: grid; gap: 8px;
    grid-template-columns: minmax(0, 1fr); grid-template-rows: minmax(0, 1fr) auto minmax(0, 1fr);
  }
  @media (min-aspect-ratio: 5/4) {
    main { grid-template-columns: minmax(0, 1fr) clamp(80px, 12vw, 110px) minmax(0, 1fr); grid-template-rows: minmax(0, 1fr); }
  }

  /* ---------- centre strip ---------- */
  .mid { display: flex; flex-direction: row; gap: 6px; min-width: 0; min-height: 0; overflow: hidden; }
  .btn {
    flex: 1; min-height: 44px; padding: 0 4px; border-radius: 8px; background: transparent;
    border: 2px solid var(--line); color: var(--fg); font-weight: 700; font-size: 14px; line-height: 1.15;
  }
  #next { flex: 1.6; background: var(--fg); color: var(--bg); border-color: var(--fg); font-size: 16px; }
  .btn.confirm { background: var(--fg); color: var(--bg); border-color: var(--fg); }
  .result {
    flex: 1.6; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center;
    padding: 4px; border-radius: 8px; color: #fff; font-weight: 700; font-size: 15px; line-height: 1.2; font-variant-numeric: tabular-nums;
  }
  .result .rs { font-family: var(--font-display); font-size: 20px; }
  .result.red { background: var(--red); }
  .result.blue { background: var(--blue); }
  .result.tie { background: var(--fg); color: var(--bg); }
  @media (min-aspect-ratio: 5/4) {
    .mid { flex-direction: column; }
    .btn { flex: 0 0 auto; }
    #next, .result { flex: 1 1 0; min-height: 0; }
    #back { order: 1; } .result { order: 2; }
  }

  /* ---------- panels ---------- */
  .panel {
    --side: var(--red); background: var(--side); color: #fff; border-radius: 12px; padding: 8px;
    display: grid; grid-template-rows: auto minmax(0, 1fr) auto; gap: 6px;
    container-type: size; min-width: 0; min-height: 0; overflow: hidden;
  }
  .panel.blue { --side: var(--blue); }
  .panel.win { box-shadow: inset 0 0 0 4px #fff; }
  .panel.locked .phases, .panel.locked .foot { opacity: .5; }
  .panel.zeroed .phases { opacity: .45; }

  .head { display: flex; justify-content: space-between; align-items: center; gap: 6px; min-width: 0; }
  .who { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
  .chip-row { display: flex; align-items: center; gap: 6px; }
  .chip { background: rgba(0,0,0,.28); border-radius: 6px; padding: 2px 10px; font: 700 16px var(--font-display); letter-spacing: .1em; text-transform: uppercase; }
  .tag { background: #fff; color: #111; font-weight: 700; font-size: 12px; padding: 2px 8px; border-radius: 6px; white-space: nowrap; }
  .sum { display: flex; gap: 4px; }
  .cell { background: rgba(0,0,0,.22); border-radius: 6px; padding: 1px 6px; text-align: center; }
  .cell small { display: block; font-size: 10px; font-weight: 600; white-space: nowrap; }
  .cell b { display: block; font-family: var(--font-display); font-size: 17px; line-height: 1.1; font-variant-numeric: tabular-nums; }
  .cell.cur { outline: 2px solid rgba(255,255,255,.85); }
  .cell.sumc { background: #fff; color: var(--side); }

  .total {
    font-family: var(--font-display); font-weight: 700; font-size: 17vmin; font-size: min(24cqh, 26cqw);
    line-height: .86; font-variant-numeric: tabular-nums; text-align: right;
  }
  .total.bump { animation: bump .22s ease-out; }
  @keyframes bump { 0% { transform: scale(1.1); } 100% { transform: scale(1); } }

  .phases { display: grid; grid-template-columns: 1.3fr 1fr; gap: 8px; min-height: 0; }
  .phase { display: flex; flex-direction: column; gap: 4px; min-height: 0; min-width: 0; }
  .ph-head { display: flex; justify-content: space-between; align-items: flex-end; gap: 4px; }
  .ph-label { font-weight: 700; font-size: 12px; line-height: 1.1; white-space: nowrap; }
  .ph-read { font-family: var(--font-display); font-weight: 700; font-size: 22px; line-height: 1; font-variant-numeric: tabular-nums; }
  .meter { height: 4px; border-radius: 2px; background: rgba(0,0,0,.3); overflow: hidden; flex: none; }
  .meter b { display: block; height: 100%; background: #fff; width: 100%; transition: width .15s; }

  .big {
    flex: 1; min-height: 36px; border-radius: 10px; font-family: var(--font-display); font-weight: 700;
    line-height: 1; font-variant-numeric: tabular-nums; transition: transform .06s;
  }
  .big:active:not(:disabled) { transform: scale(.97); }
  .big:disabled { opacity: .35; cursor: not-allowed; }
  .big.deduct { background: #fff; color: var(--side); font-size: clamp(30px, min(18cqh, 19cqw), 96px); }
  .big.add { background: rgba(0,0,0,.32); color: #fff; border: 2px solid rgba(255,255,255,.7); font-size: clamp(24px, min(11cqh, 15cqw), 60px); }

  .foot { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .small { min-height: 44px; border-radius: 10px; background: rgba(0,0,0,.3); color: #fff; font-weight: 700; font-size: 15px; padding: 0 4px; }
  .small:disabled { opacity: .35; cursor: not-allowed; }
  .small.zero.on { background: #fff; color: var(--side); }

  @container (max-width: 300px) {
    .ph-label { font-size: 10px; } .ph-read { font-size: 16px; }
    .total { font-size: min(20cqh, 21cqw); }
    .cell { padding: 1px 4px; } .cell b { font-size: 15px; }
  }
  @container (max-height: 270px) { .big { min-height: 28px; } .small { min-height: 34px; } }

  /* Landscape: blue panel is the left-right mirror of red */
  @media (min-aspect-ratio: 5/4) {
    .panel.blue .head { flex-direction: row-reverse; }
    .panel.blue .who { align-items: flex-end; }
    .panel.blue .chip-row, .panel.blue .sum { flex-direction: row-reverse; }
    .panel.blue .total { text-align: left; }
    .panel.blue .phases { grid-template-columns: 1fr 1.3fr; }
    .panel.blue .phase:nth-child(1) { order: 2; }
    .panel.blue .ph-head { flex-direction: row-reverse; }
    .panel.blue .foot .small:nth-child(1) { order: 2; }
  }
  @media (prefers-reduced-motion: reduce) { .total.bump { animation: none; } .meter b, .big { transition: none; } }
</style>

<main>
  <section class="panel red" data-side="red" aria-label="Red">
    <div class="head">
      <div class="who">
        <div class="chip-row"><span class="chip">Red</span><span class="tag" id="red-tag" hidden>⌀ Zero</span><span class="tag" id="red-win" hidden>★ Win</span></div>
        <div class="sum">
          <div class="cell" id="red-c1"><small>P1</small><b id="red-s1">—</b></div>
          <div class="cell" id="red-c2"><small>P2</small><b id="red-s2">—</b></div>
          <div class="cell sumc"><small>Σ</small><b id="red-sum">0.0</b></div>
        </div>
      </div>
      <div class="total" id="red-total" aria-live="polite">10.0</div>
    </div>
    <div class="phases">
      <div class="phase">
        <div class="ph-head"><div class="ph-label">① Accuracy</div><div class="ph-read" id="red-p1">6.0</div></div>
        <div class="meter"><b id="red-m1"></b></div>
        <button class="big deduct" type="button" data-act="ded" id="red-ded" aria-label="Red deduct 0.2">−0.2</button>
      </div>
      <div class="phase">
        <div class="ph-head"><div class="ph-label">② Perf.</div><div class="ph-read" id="red-p2">0.0</div></div>
        <div class="meter"><b id="red-m2"></b></div>
        <button class="big add" type="button" data-act="add" id="red-add" aria-label="Red add 0.5">+0.5</button>
      </div>
    </div>
    <div class="foot">
      <button class="small" type="button" data-act="undo" id="red-undo">↶ Undo</button>
      <button class="small zero" type="button" data-act="zero" id="red-zero"></button>
    </div>
  </section>

  <div class="mid">
    <button class="btn" id="next" type="button"></button>
    <button class="btn" id="back" type="button" hidden></button>
    <div class="result" id="result" hidden aria-live="polite"></div>
    <button class="btn" id="resetp" type="button"></button>
    <button class="btn" id="reset" type="button"></button>
  </div>

  <section class="panel blue" data-side="blue" aria-label="Blue">
    <div class="head">
      <div class="who">
        <div class="chip-row"><span class="chip">Blue</span><span class="tag" id="blue-tag" hidden>⌀ Zero</span><span class="tag" id="blue-win" hidden>★ Win</span></div>
        <div class="sum">
          <div class="cell" id="blue-c1"><small>P1</small><b id="blue-s1">—</b></div>
          <div class="cell" id="blue-c2"><small>P2</small><b id="blue-s2">—</b></div>
          <div class="cell sumc"><small>Σ</small><b id="blue-sum">0.0</b></div>
        </div>
      </div>
      <div class="total" id="blue-total" aria-live="polite">10.0</div>
    </div>
    <div class="phases">
      <div class="phase">
        <div class="ph-head"><div class="ph-label">① Accuracy</div><div class="ph-read" id="blue-p1">6.0</div></div>
        <div class="meter"><b id="blue-m1"></b></div>
        <button class="big deduct" type="button" data-act="ded" id="blue-ded" aria-label="Blue deduct 0.2">−0.2</button>
      </div>
      <div class="phase">
        <div class="ph-head"><div class="ph-label">② Perf.</div><div class="ph-read" id="blue-p2">0.0</div></div>
        <div class="meter"><b id="blue-m2"></b></div>
        <button class="big add" type="button" data-act="add" id="blue-add" aria-label="Blue add 0.5">+0.5</button>
      </div>
    </div>
    <div class="foot">
      <button class="small" type="button" data-act="undo" id="blue-undo">↶ Undo</button>
      <button class="small zero" type="button" data-act="zero" id="blue-zero"></button>
    </div>
  </section>
</main>

<script>
(function () {
  var KEY = 'itf-tul-simple-v1';
  var MAX_D = 30, MAX_A = 8;            // 6.0 / 0.2 and 4.0 / 0.5
  // Scores are integer tenths of a point to avoid floating-point drift.
  var entry = function () { return { d: 0, a: 0, z: false, h: [] }; };
  var fresh = function () { return { stage: 1, red: [entry(), entry()], blue: [entry(), entry()] }; };
  var S = fresh();
  var $ = function (id) { return document.getElementById(id); };
  var fmt = function (n) { return (n / 10).toFixed(1); };
  var score = function (e) { return e.z ? 0 : 60 - 2 * e.d + 5 * e.a; };
  var idx = function () { return S.stage === 3 ? 1 : S.stage - 1; };
  var vib = function () { try { if (navigator.vibrate) navigator.vibrate(12); } catch (e) {} };
  var panel = function (side) { return document.querySelector('.panel[data-side="' + side + '"]'); };

  function clean(x) {
    var s = entry();
    if (!x || typeof x !== 'object') return s;
    s.d = Math.max(0, Math.min(MAX_D, x.d | 0));
    s.a = Math.max(0, Math.min(MAX_A, x.a | 0));
    s.z = !!x.z;
    s.h = Array.isArray(x.h) ? x.h.filter(function (v) { return v === 'd' || v === 'a'; }).slice(-60) : [];
    return s;
  }
  try {
    var saved = JSON.parse(localStorage.getItem(KEY) || 'null');
    if (saved) {
      S.stage = Math.max(1, Math.min(3, saved.stage | 0)) || 1;
      ['red', 'blue'].forEach(function (k) { S[k] = [clean(saved[k] && saved[k][0]), clean(saved[k] && saved[k][1])]; });
    }
  } catch (e) {}
  function save() { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} }

  function totals(side) {
    var e = S[side], s1 = score(e[0]), s2 = S.stage >= 2 ? score(e[1]) : null;
    return { s1: s1, s2: s2, sum: s1 + (s2 === null ? 0 : s2) };
  }

  function renderSide(side, bump) {
    var i = idx(), e = S[side][i], locked = S.stage === 3, t = totals(side);
    var p1 = 60 - 2 * e.d, p2 = 5 * e.a, big = $(side + '-total');
    big.textContent = fmt(locked ? t.sum : score(e));
    if (bump) { big.classList.remove('bump'); void big.offsetWidth; big.classList.add('bump'); }
    $(side + '-s1').textContent = fmt(t.s1);
    $(side + '-s2').textContent = t.s2 === null ? '—' : fmt(t.s2);
    $(side + '-sum').textContent = fmt(t.sum);
    $(side + '-c1').classList.toggle('cur', !locked && i === 0);
    $(side + '-c2').classList.toggle('cur', !locked && i === 1);
    $(side + '-p1').textContent = fmt(p1);
    $(side + '-p2').textContent = fmt(p2);
    $(side + '-m1').style.width = (p1 / 60 * 100) + '%';
    $(side + '-m2').style.width = (p2 / 40 * 100) + '%';
    $(side + '-ded').disabled = locked || e.z || e.d >= MAX_D;
    $(side + '-add').disabled = locked || e.z || e.a >= MAX_A;
    $(side + '-undo').disabled = locked || e.z || !e.h.length;
    $(side + '-zero').textContent = e.z ? '✕ Cancel' : '⌀ Zero';
    $(side + '-zero').classList.toggle('on', e.z);
    $(side + '-zero').disabled = locked;
    $(side + '-tag').hidden = locked || !e.z;
    panel(side).classList.toggle('zeroed', !locked && e.z);
    panel(side).classList.toggle('locked', locked);
  }

  var rb = $('reset'), rpb = $('resetp'), timers = {};
  function label() {
    var st = S.stage;
    $('next').textContent = st === 1 ? 'P1 ✓ →' : 'P2 ✓ Σ';
    $('next').hidden = st === 3;
    $('back').hidden = st === 1;
    $('back').textContent = '← ' + (st === 2 ? 'P1' : 'Edit');
    if (!rb.classList.contains('confirm')) rb.textContent = '↺ Round';
    rpb.hidden = st === 3;
    if (!rpb.classList.contains('confirm')) rpb.textContent = '↺ Pattern';
  }
  function renderCtrl() {
    label();
    var res = $('result'), rt = totals('red').sum, bt = totals('blue').sum;
    var winner = S.stage === 3 ? (rt > bt ? 'red' : (bt > rt ? 'blue' : 'tie')) : null;
    res.hidden = S.stage !== 3;
    if (winner) {
      res.className = 'result ' + winner;
      res.textContent = '';
      var a = document.createElement('div'); a.textContent = winner === 'tie' ? '＝ Draw' : (winner === 'red' ? '★ Red wins' : '★ Blue wins');
      var b = document.createElement('div'); b.className = 'rs'; b.textContent = fmt(rt) + ' : ' + fmt(bt);
      res.appendChild(a); res.appendChild(b);
    }
    ['red', 'blue'].forEach(function (side) {
      $(side + '-win').hidden = winner !== side;
      panel(side).classList.toggle('win', winner === side);
    });
  }
  function renderAll(bump) { renderSide('red', bump); renderSide('blue', bump); renderCtrl(); }

  document.addEventListener('click', function (ev) {
    var btn = ev.target.closest('button[data-act]');
    if (!btn || S.stage === 3) return;
    var side = btn.closest('.panel').getAttribute('data-side'), e = S[side][idx()], act = btn.getAttribute('data-act');
    if (act === 'ded' && !e.z && e.d < MAX_D) { e.d++; e.h.push('d'); }
    else if (act === 'add' && !e.z && e.a < MAX_A) { e.a++; e.h.push('a'); }
    else if (act === 'undo' && !e.z && e.h.length) { if (e.h.pop() === 'd') e.d--; else e.a--; }
    else if (act === 'zero') e.z = !e.z;
    else return;
    vib(); save(); renderSide(side, true); renderCtrl();
  });

  $('next').addEventListener('click', function () { if (S.stage < 3) { S.stage++; vib(); save(); renderAll(true); } });
  $('back').addEventListener('click', function () { if (S.stage > 1) { S.stage--; vib(); save(); renderAll(true); } });

  // Reset buttons need a second tap within 3 s.
  function armed(btn, text, run) {
    btn.addEventListener('click', function () {
      if (!btn.classList.contains('confirm')) {
        btn.classList.add('confirm'); btn.textContent = 'Tap again ↺';
        timers[btn.id] = setTimeout(function () { btn.classList.remove('confirm'); label(); }, 3000);
        return;
      }
      clearTimeout(timers[btn.id]); btn.classList.remove('confirm'); run(); save(); renderAll(true);
    });
  }
  armed(rb, '↺ Round', function () { S = fresh(); });
  armed(rpb, '↺ Pattern', function () { var i = idx(); S.red[i] = entry(); S.blue[i] = entry(); });

  renderAll(false);

  // keep the screen on while scoring (optional)
  function wake() { try { if (navigator.wakeLock && document.visibilityState === 'visible') navigator.wakeLock.request('screen').catch(function () {}); } catch (e) {} }
  document.addEventListener('visibilitychange', wake); wake();
})();
</script>
