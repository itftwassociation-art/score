<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Kyorugi Scoreboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #121214;
    --panel-hong: #a8152c;
    --panel-hong-dim: #7c0f21;
    --panel-chong: #14337e;
    --panel-chong-dim: #0d2359;
    --center: #1b1b1d;
    --ink: #f4efe4;
    --ink-dim: rgba(244,239,228,0.55);
    --gold: #c9a24a;
    --line: rgba(244,239,228,0.14);
    --danger: #e2543a;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color: transparent;}
  html,body{height:100%;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--ink);
    font-family:'Inter',system-ui,sans-serif;
    overflow:hidden;
    height:100vh;
    height:100dvh;
  }
  .app{
    display:flex;
    flex-direction:column;
    height:100vh;
    height:100dvh;
  }

  /* ---------- Top bar ---------- */
  .topbar{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:10px 16px;
    background:var(--center);
    border-bottom:1px solid var(--line);
    flex:0 0 auto;
  }
  .brand{
    display:flex;
    align-items:baseline;
    gap:8px;
  }
  .brand .mark{
    font-family:'Oswald',sans-serif;
    font-weight:600;
    font-size:15px;
    letter-spacing:0.04em;
    color:var(--gold);
  }
  .brand .sub{
    font-size:11px;
    color:var(--ink-dim);
  }
  .reset-btn{
    background:transparent;
    border:1px solid var(--line);
    color:var(--ink-dim);
    font-family:'Inter',sans-serif;
    font-size:12px;
    padding:7px 12px;
    border-radius:6px;
    cursor:pointer;
  }
  .reset-btn:hover{ color:var(--ink); border-color: var(--ink-dim); }

  /* ---------- Center strip: rounds + timer ---------- */
  .center-strip{
    flex:0 0 auto;
    background:var(--center);
    display:flex;
    align-items:center;
    justify-content:center;
    gap:22px;
    padding:8px 12px 14px;
    border-bottom:1px solid var(--line);
  }
  .rounds{
    display:flex;
    gap:6px;
    align-items:center;
  }
  .round-dot{
    width:9px;height:9px;border-radius:50%;
    background: rgba(244,239,228,0.18);
    border: 1px solid var(--line);
  }
  .round-dot.active{ background: var(--gold); border-color: var(--gold); }
  .round-dot.won-hong{ background: var(--panel-hong); border-color: var(--panel-hong); }
  .round-dot.won-chong{ background: var(--panel-chong); border-color: var(--panel-chong); }

  .round-label{
    font-family:'Oswald',sans-serif;
    font-size:12px;
    letter-spacing:0.04em;
    color: var(--ink-dim);
    min-width:70px;
    text-align:center;
  }

  .timer{
    font-family:'Oswald',sans-serif;
    font-variant-numeric: tabular-nums;
    font-size:34px;
    font-weight:600;
    letter-spacing:0.02em;
    min-width:118px;
    text-align:center;
    color: var(--ink);
  }
  .timer.running{ color: var(--gold); }
  .timer.low{ color: var(--danger); }

  .timer-controls{
    display:flex;
    gap:6px;
  }
  .tbtn{
    background: rgba(244,239,228,0.06);
    border:1px solid var(--line);
    color:var(--ink);
    width:38px;height:38px;
    border-radius:8px;
    font-size:16px;
    display:flex;align-items:center;justify-content:center;
    cursor:pointer;
  }
  .tbtn:active{ transform: scale(0.94); }
  .tbtn.play{ background: var(--gold); color:#1a1a1a; border-color:var(--gold); }
  .tbtn.wide{ width:auto; padding:0 12px; font-family:'Inter'; font-size:12px; }

  /* ---------- Main split ---------- */
  .arena{
    flex:1 1 auto;
    display:flex;
    min-height:0;
  }
  .side{
    flex:1 1 50%;
    display:flex;
    flex-direction:column;
    position:relative;
    min-width:0;
  }
  .side.hong{ background: linear-gradient(180deg, var(--panel-hong) 0%, var(--panel-hong-dim) 100%); }
  .side.chong{ background: linear-gradient(180deg, var(--panel-chong) 0%, var(--panel-chong-dim) 100%); }

  .side-head{
    flex:0 0 auto;
    padding:10px 16px 0;
    display:flex;
    align-items:center;
    justify-content:space-between;
  }
  .name-wrap{
    display:flex;
    align-items:baseline;
    gap:8px;
    min-width:0;
  }
  .hangul{
    font-family:'Oswald',sans-serif;
    font-size:15px;
    color: rgba(244,239,228,0.6);
    flex:0 0 auto;
  }
  .name{
    font-family:'Oswald',sans-serif;
    font-size:16px;
    font-weight:500;
    letter-spacing:0.02em;
    background:transparent;
    border:none;
    color:var(--ink);
    border-bottom:1px solid transparent;
    padding:2px 0;
    width:100%;
    min-width:0;
  }
  .name:focus{ outline:none; border-bottom-color: rgba(244,239,228,0.5); }
  .gam{
    font-family:'Inter';
    font-size:12px;
    color: rgba(244,239,228,0.75);
    white-space:nowrap;
  }

  .score-wrap{
    flex:1 1 auto;
    display:flex;
    align-items:center;
    justify-content:center;
    min-height:0;
  }
  .score{
    font-family:'Oswald',sans-serif;
    font-weight:700;
    font-size:min(28vw, 190px);
    line-height:1;
    letter-spacing:-0.01em;
    -webkit-user-select:none;
    user-select:none;
  }

  .points-row{
    flex:0 0 auto;
    display:flex;
    gap:8px;
    padding:0 12px 8px;
  }
  .pt-btn{
    flex:1;
    background: rgba(0,0,0,0.18);
    border:1px solid rgba(244,239,228,0.28);
    color:var(--ink);
    border-radius:10px;
    padding:14px 4px;
    font-family:'Oswald',sans-serif;
    font-size:22px;
    font-weight:600;
    cursor:pointer;
  }
  .pt-btn:active{ background: rgba(0,0,0,0.34); transform: scale(0.97); }

  .minor-row{
    flex:0 0 auto;
    display:flex;
    gap:8px;
    padding:0 12px 12px;
  }
  .minor-btn{
    flex:1;
    background: transparent;
    border:1px solid rgba(244,239,228,0.22);
    color: rgba(244,239,228,0.85);
    border-radius:8px;
    padding:8px 4px;
    font-family:'Inter';
    font-size:12px;
    cursor:pointer;
  }
  .minor-btn:active{ background: rgba(0,0,0,0.2); }

  .divider{
    width:1px;
    background: rgba(0,0,0,0.4);
    flex:0 0 auto;
  }

  /* ---------- Bottom bar ---------- */
  .bottombar{
    flex:0 0 auto;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:10px;
    padding:9px 12px;
    background:var(--center);
    border-top:1px solid var(--line);
  }
  .action-btn{
    background: rgba(244,239,228,0.06);
    border:1px solid var(--line);
    color:var(--ink);
    padding:9px 16px;
    border-radius:8px;
    font-family:'Inter';
    font-size:13px;
    font-weight:500;
    cursor:pointer;
    display:flex;
    align-items:center;
    gap:6px;
  }
  .action-btn:active{ transform: scale(0.97); }
  .action-btn.primary{ background: var(--gold); color:#1a1a1a; border-color:var(--gold); }
  .action-btn:disabled{ opacity:0.35; cursor:default; }

  /* ---------- Overlay: match won ---------- */
  .overlay{
    position:fixed; inset:0;
    background: rgba(8,8,9,0.86);
    display:none;
    align-items:center;
    justify-content:center;
    z-index:20;
    padding:20px;
  }
  .overlay.show{ display:flex; }
  .overlay-card{
    background: var(--center);
    border:1px solid var(--line);
    border-radius:14px;
    padding:28px 30px;
    text-align:center;
    max-width:340px;
    width:100%;
  }
  .overlay-card .win-label{
    font-family:'Inter'; font-size:12px; color:var(--ink-dim); letter-spacing:0.03em; margin-bottom:6px;
  }
  .overlay-card .win-name{
    font-family:'Oswald',sans-serif; font-size:30px; font-weight:600; margin-bottom:4px;
  }
  .overlay-card .win-detail{
    font-family:'Inter'; font-size:13px; color:var(--ink-dim); margin-bottom:20px;
  }
  .overlay-card .action-btn{ width:100%; justify-content:center; }

  /* ---------- Round-end sheet ---------- */
  .sheet-back{
    position:fixed; inset:0;
    background: rgba(8,8,9,0.7);
    display:none;
    align-items:flex-end;
    justify-content:center;
    z-index:20;
  }
  .sheet-back.show{ display:flex; }
  .sheet{
    background: var(--center);
    border-top:1px solid var(--line);
    border-radius:16px 16px 0 0;
    padding:20px 20px 26px;
    width:100%;
    max-width:520px;
  }
  .sheet h3{
    font-family:'Oswald',sans-serif; font-weight:500; font-size:16px; margin:0 0 4px;
  }
  .sheet p{
    font-family:'Inter'; font-size:12px; color:var(--ink-dim); margin:0 0 16px;
  }
  .sheet-row{
    display:flex; gap:10px; margin-bottom:10px;
  }
  .sheet-btn{
    flex:1;
    padding:14px 6px;
    border-radius:10px;
    font-family:'Oswald',sans-serif;
    font-size:15px;
    font-weight:600;
    border:1px solid var(--line);
    cursor:pointer;
    color:var(--ink);
  }
  .sheet-btn.hong{ background: rgba(168,21,44,0.35); border-color: var(--panel-hong); }
  .sheet-btn.chong{ background: rgba(20,51,126,0.35); border-color: var(--panel-chong); }
  .sheet-cancel{
    width:100%;
    background:transparent;
    border:1px solid var(--line);
    color: var(--ink-dim);
    padding:10px;
    border-radius:8px;
    font-family:'Inter';
    font-size:12px;
    cursor:pointer;
  }

  @media (max-width: 620px){
    .score{ font-size: min(24vw, 130px); }
    .timer{ font-size:26px; min-width:96px; }
    .center-strip{ gap:14px; }
    .hangul{ font-size:13px; }
    .name{ font-size:14px; }
  }
</style>
</head>
<body>
<div class="app">

  <div class="topbar">
    <div class="brand">
      <span class="mark">KYORUGI</span>
      <span class="sub">point recorder</span>
    </div>
    <button class="reset-btn" id="resetMatchBtn">Reset match</button>
  </div>

  <div class="center-strip">
    <div class="rounds" id="roundDots"></div>
    <div class="round-label" id="roundLabel">ROUND 1</div>
    <div class="timer" id="timerDisplay">2:00</div>
    <div class="timer-controls">
      <button class="tbtn play" id="playBtn" title="Start / pause">▶</button>
      <button class="tbtn" id="timerResetBtn" title="Reset timer">↺</button>
    </div>
  </div>

  <div class="arena">
    <div class="side hong" data-side="hong">
      <div class="side-head">
        <div class="name-wrap">
          <span class="hangul">홍</span>
          <input class="name" id="nameHong" value="Hong" maxlength="16">
        </div>
        <div class="gam" id="gamHong">Gam-jeom: 0</div>
      </div>
      <div class="score-wrap"><div class="score" id="scoreHong">0</div></div>
      <div class="points-row">
        <button class="pt-btn" data-side="hong" data-pts="1">+1</button>
        <button class="pt-btn" data-side="hong" data-pts="2">+2</button>
        <button class="pt-btn" data-side="hong" data-pts="3">+3</button>
      </div>
      <div class="minor-row">
        <button class="minor-btn" data-action="gam" data-side="hong">+ Gam-jeom</button>
        <button class="minor-btn" data-action="undo-side" data-side="hong">Undo last</button>
      </div>
    </div>

    <div class="divider"></div>

    <div class="side chong" data-side="chong">
      <div class="side-head">
        <div class="gam" id="gamChong">Gam-jeom: 0</div>
        <div class="name-wrap">
          <input class="name" id="nameChong" value="Chong" maxlength="16" style="text-align:right">
          <span class="hangul">청</span>
        </div>
      </div>
      <div class="score-wrap"><div class="score" id="scoreChong">0</div></div>
      <div class="points-row">
        <button class="pt-btn" data-side="chong" data-pts="1">+1</button>
        <button class="pt-btn" data-side="chong" data-pts="2">+2</button>
        <button class="pt-btn" data-side="chong" data-pts="3">+3</button>
      </div>
      <div class="minor-row">
        <button class="minor-btn" data-action="undo-side" data-side="chong">Undo last</button>
        <button class="minor-btn" data-action="gam" data-side="chong">+ Gam-jeom</button>
      </div>
    </div>
  </div>

  <div class="bottombar">
    <button class="action-btn" id="undoBtn">Undo</button>
    <button class="action-btn primary" id="endRoundBtn">End round</button>
  </div>

</div>

<!-- Round end sheet -->
<div class="sheet-back" id="sheetBack">
  <div class="sheet">
    <h3 id="sheetTitle">End round 1</h3>
    <p id="sheetSub">Who won this round?</p>
    <div class="sheet-row">
      <button class="sheet-btn hong" id="sheetHongBtn">Hong (홍)</button>
      <button class="sheet-btn chong" id="sheetChongBtn">Chong (청)</button>
    </div>
    <button class="sheet-cancel" id="sheetCancelBtn">Cancel</button>
  </div>
</div>

<!-- Match won overlay -->
<div class="overlay" id="winOverlay">
  <div class="overlay-card">
    <div class="win-label">MATCH WINNER</div>
    <div class="win-name" id="winName">—</div>
    <div class="win-detail" id="winDetail">—</div>
    <button class="action-btn primary" id="newMatchBtn">Start new match</button>
  </div>
</div>

<script>
(function(){
  const ROUND_SECONDS = 120;
  const TOTAL_ROUNDS = 3;
  const ROUNDS_TO_WIN = 2;

  let state = {
    scores: { hong: 0, chong: 0 },
    gam: { hong: 0, chong: 0 },
    roundWins: { hong: 0, chong: 0 },
    roundHistory: [], // {round, hong, chong, winner}
    currentRound: 1,
    secondsLeft: ROUND_SECONDS,
    timerRunning: false,
    history: [], // undo stack: {side, type, value}
    matchOver: false
  };

  let timerInterval = null;

  const el = id => document.getElementById(id);
  const scoreHongEl = el('scoreHong');
  const scoreChongEl = el('scoreChong');
  const gamHongEl = el('gamHong');
  const gamChongEl = el('gamChong');
  const timerDisplay = el('timerDisplay');
  const playBtn = el('playBtn');
  const roundDots = el('roundDots');
  const roundLabel = el('roundLabel');
  const undoBtn = el('undoBtn');
  const endRoundBtn = el('endRoundBtn');

  function fmtTime(s){
    const m = Math.floor(s/60);
    const sec = s%60;
    return m + ':' + String(sec).padStart(2,'0');
  }

  function render(){
    scoreHongEl.textContent = state.scores.hong;
    scoreChongEl.textContent = state.scores.chong;
    gamHongEl.textContent = 'Gam-jeom: ' + state.gam.hong;
    gamChongEl.textContent = 'Gam-jeom: ' + state.gam.chong;
    timerDisplay.textContent = fmtTime(state.secondsLeft);
    timerDisplay.classList.toggle('running', state.timerRunning);
    timerDisplay.classList.toggle('low', state.secondsLeft <= 10 && state.secondsLeft > 0);
    playBtn.textContent = state.timerRunning ? '❚❚' : '▶';
    roundLabel.textContent = state.matchOver ? 'FINAL' : ('ROUND ' + state.currentRound);
    undoBtn.disabled = state.history.length === 0;

    // round dots
    roundDots.innerHTML = '';
    for(let i=1;i<=TOTAL_ROUNDS;i++){
      const dot = document.createElement('div');
      dot.className = 'round-dot';
      const rec = state.roundHistory.find(r => r.round === i);
      if(rec){
        dot.classList.add(rec.winner === 'hong' ? 'won-hong' : 'won-chong');
      } else if(i === state.currentRound && !state.matchOver){
        dot.classList.add('active');
      }
      roundDots.appendChild(dot);
    }
  }

  function pushHistory(entry){
    state.history.push(entry);
  }

  function addPoints(side, pts){
    if(state.matchOver) return;
    state.scores[side] += pts;
    pushHistory({type:'points', side, value:pts});
    render();
  }

  function addGam(side){
    if(state.matchOver) return;
    state.gam[side] += 1;
    const other = side === 'hong' ? 'chong' : 'hong';
    state.scores[other] += 1;
    pushHistory({type:'gam', side, opponent:other});
    render();
  }

  function undoLast(filterSide){
    let idx = -1;
    for(let i=state.history.length-1;i>=0;i--){
      const h = state.history[i];
      if(!filterSide || h.side === filterSide){ idx = i; break; }
    }
    if(idx === -1) return;
    const h = state.history[idx];
    if(h.type === 'points'){
      state.scores[h.side] -= h.value;
    } else if(h.type === 'gam'){
      state.gam[h.side] -= 1;
      state.scores[h.opponent] -= 1;
    }
    state.history.splice(idx,1);
    render();
  }

  // ---- timer ----
  function tick(){
    if(state.secondsLeft > 0){
      state.secondsLeft -= 1;
      render();
    }
    if(state.secondsLeft === 0){
      pauseTimer();
    }
  }
  function startTimer(){
    if(state.matchOver) return;
    state.timerRunning = true;
    timerInterval = setInterval(tick, 1000);
    render();
  }
  function pauseTimer(){
    state.timerRunning = false;
    clearInterval(timerInterval);
    render();
  }
  function resetTimer(){
    pauseTimer();
    state.secondsLeft = ROUND_SECONDS;
    render();
  }

  playBtn.addEventListener('click', () => {
    state.timerRunning ? pauseTimer() : startTimer();
  });
  el('timerResetBtn').addEventListener('click', resetTimer);

  // ---- point buttons ----
  document.querySelectorAll('.pt-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      addPoints(btn.dataset.side, parseInt(btn.dataset.pts,10));
    });
  });

  document.querySelectorAll('.minor-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      const action = btn.dataset.action;
      const side = btn.dataset.side;
      if(action === 'gam') addGam(side);
      if(action === 'undo-side') undoLast(side);
    });
  });

  undoBtn.addEventListener('click', () => undoLast(null));

  // ---- round end flow ----
  const sheetBack = el('sheetBack');
  el('endRoundBtn').addEventListener('click', () => {
    if(state.matchOver) return;
    el('sheetTitle').textContent = 'End round ' + state.currentRound;
    el('sheetSub').textContent = 'Current score ' + state.scores.hong + ' – ' + state.scores.chong + '. Who won this round?';
    sheetBack.classList.add('show');
  });
  el('sheetCancelBtn').addEventListener('click', () => sheetBack.classList.remove('show'));

  function finishRound(winnerSide){
    sheetBack.classList.remove('show');
    state.roundHistory.push({
      round: state.currentRound,
      hong: state.scores.hong,
      chong: state.scores.chong,
      winner: winnerSide
    });
    state.roundWins[winnerSide] += 1;

    const matchWon = state.roundWins[winnerSide] >= ROUNDS_TO_WIN;

    if(matchWon){
      state.matchOver = true;
      showWinOverlay(winnerSide);
      render();
      return;
    }
    if(state.currentRound >= TOTAL_ROUNDS){
      // all rounds played, decide by round wins (tie fallback: higher round wins already handled above)
      const finalWinner = state.roundWins.hong === state.roundWins.chong
        ? (state.scores.hong >= state.scores.chong ? winnerSide : winnerSide) // fallback: last round winner
        : (state.roundWins.hong > state.roundWins.chong ? 'hong' : 'chong');
      state.matchOver = true;
      showWinOverlay(finalWinner);
      render();
      return;
    }

    // advance to next round
    state.currentRound += 1;
    state.scores.hong = 0;
    state.scores.chong = 0;
    state.gam.hong = 0;
    state.gam.chong = 0;
    state.history = [];
    resetTimer();
    render();
  }

  el('sheetHongBtn').addEventListener('click', () => finishRound('hong'));
  el('sheetChongBtn').addEventListener('click', () => finishRound('chong'));

  function showWinOverlay(side){
    const name = side === 'hong' ? el('nameHong').value : el('nameChong').value;
    el('winName').textContent = name || (side === 'hong' ? 'Hong' : 'Chong');
    el('winDetail').textContent = 'Rounds won ' + state.roundWins.hong + ' – ' + state.roundWins.chong;
    el('winOverlay').classList.add('show');
  }

  el('newMatchBtn').addEventListener('click', () => {
    el('winOverlay').classList.remove('show');
    resetMatch(false);
  });

  function resetMatch(keepNames){
    pauseTimer();
    state = {
      scores: { hong: 0, chong: 0 },
      gam: { hong: 0, chong: 0 },
      roundWins: { hong: 0, chong: 0 },
      roundHistory: [],
      currentRound: 1,
      secondsLeft: ROUND_SECONDS,
      timerRunning: false,
      history: [],
      matchOver: false
    };
    render();
  }

  el('resetMatchBtn').addEventListener('click', () => {
    if(confirm('Reset the whole match? This clears scores, rounds and the timer.')){
      resetMatch(true);
    }
  });

  render();
})();
</script>
</body>
</html>
